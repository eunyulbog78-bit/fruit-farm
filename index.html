<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍎 과일 농장</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body {
    width:100%; height:100%;
    background:#1a1a1a; color:#fff;
    font-family:'맑은 고딕','Malgun Gothic',sans-serif;
    display:flex; justify-content:center; align-items:center;
    overflow:hidden;
}
body.waterdrop { background:linear-gradient(135deg,#050a1a 0%,#051432 100%); }

/* 데스크톱: 정사각형 */
.app {
    width: min(100vw, 100vh);
    height: min(100vw, 100vh);
    background:#000;
    position:relative;
    display:flex; flex-direction:column;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 0 40px rgba(0,0,0,.8);
}
body.waterdrop .app { background:linear-gradient(135deg,#050a1a 0%,#051432 100%); }

.screen { display:none; padding:16px; width:100%; height:100%; flex-direction:column; overflow:hidden; }
.screen.active { display:flex; }

.btn {
    border:none; border-radius:6px; cursor:pointer;
    font-family:inherit; font-weight:bold;
    transition:filter .1s;
    touch-action:manipulation; 
}
.btn:active { filter:brightness(0.85); }
.btn:disabled { opacity:.4; cursor:default; filter:none; }

/* ── 모바일: 전체화면, 스크롤 허용 ── */
@media (max-width:600px) {
    html, body { align-items:flex-start; overflow:auto; }
    .app {
        width:100vw; height:100dvh;
        border-radius:0; box-shadow:none;
    }
    .screen { padding:12px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
    #action-btn {
        width:clamp(130px,38vw,180px) !important;
        height:clamp(130px,38vw,180px) !important;
        font-size:clamp(44px,12vw,64px) !important;
    }
    .modal-box { padding:16px; max-height:92dvh; }
    .notif-emoji { font-size:clamp(48px,18vw,80px) !important; }
    .notif-name  { font-size:clamp(16px,5vw,22px) !important; }
}

.modal {
    display:none; position:fixed; top:0; left:0;
    width:100%; height:100%; background:rgba(0,0,0,.82);
    z-index:100; align-items:center; justify-content:center;
}
.modal.open { display:flex; }
.modal-box {
    background:#111; border-radius:16px; padding:22px;
    width:92%; max-width:420px;
    max-height:88vh; max-height:88dvh;
    overflow-y:auto;
}
/* 자세히 보기 전용 — 등급 클래스가 덮어씀 */
#modal-detail .modal-box { padding:28px 22px; }

#drop-backdrop {
    display:none; position:fixed; inset:0;
    background:rgba(0,0,0,.6); z-index:199;
}
#drop-backdrop.show { display:block; }

#drop-notif {
    position:fixed; top:50%; left:50%;
    transform:translate(-50%, -50%) scale(0.85);
    z-index:200; pointer-events:none;
    opacity:0; transition:opacity .2s, transform .2s;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    background:#111; border-radius:20px;
    padding:24px 36px; border:3px solid #555;
    min-width:240px;
}
#drop-notif.show {
    opacity:1; pointer-events:auto;
    transform:translate(-50%, -50%) scale(1);
}
#drop-notif .notif-emoji { font-size:80px; line-height:1; }
#drop-notif .notif-name  { font-size:22px; font-weight:bold; color:#fff; }
#drop-notif .notif-price { font-size:14px; color:#ffd700; }
#drop-notif .notif-btns  { display:flex; gap:10px; margin-top:4px; width:100%; opacity:0; transition:opacity .3s; }
#drop-notif .notif-btns.visible { opacity:1; }
#drop-notif .notif-btns .btn { flex:1; font-size:14px; padding:11px 0; }
#drop-notif .notif-timer { font-size:12px; color:#666; margin-top:2px; }

/* 황금 과일 이모지 효과 */
.golden {
    display:inline-block;
    filter: sepia(1) saturate(6) hue-rotate(5deg) brightness(1.25)
            drop-shadow(0 0 8px #ffd700) drop-shadow(0 0 16px #ffaa00);
    animation: goldPulse 1.8s ease-in-out infinite;
}
@keyframes goldPulse {
    0%,100% { filter: sepia(1) saturate(6) hue-rotate(5deg) brightness(1.25)
                      drop-shadow(0 0 6px #ffd700) drop-shadow(0 0 14px #ffaa00); }
    50%      { filter: sepia(1) saturate(8) hue-rotate(5deg) brightness(1.45)
                      drop-shadow(0 0 14px #ffd700) drop-shadow(0 0 28px #ffcc00); }
}
/* 다이아몬드 과일 이모지 효과 */
.diamond {
    display:inline-block;
    filter: hue-rotate(195deg) saturate(4) brightness(1.5)
            drop-shadow(0 0 8px #00cfff) drop-shadow(0 0 16px #ffffff);
    animation: diaPulse 1.5s ease-in-out infinite;
}
@keyframes diaPulse {
    0%,100% { filter: hue-rotate(195deg) saturate(4) brightness(1.5)
                      drop-shadow(0 0 6px #00cfff) drop-shadow(0 0 14px #aaffff); }
    50%      { filter: hue-rotate(210deg) saturate(6) brightness(1.9)
                      drop-shadow(0 0 18px #00cfff) drop-shadow(0 0 34px #ffffff); }
}
/* 확장 토글 버튼 */
.toggle-btn {
    background:none; border:1px solid #444; border-radius:4px;
    color:#888; font-size:11px; padding:2px 6px; cursor:pointer;
    line-height:1; flex-shrink:0;
}
.toggle-btn:hover { border-color:#888; color:#fff; }
/* 서브 행 (황금/다이아) */
.sub-row {
    margin-left:14px; margin-bottom:4px; border-radius:6px;
    padding:7px 10px;
}

/* 자세히 보기 버튼 */
.detail-btn {
    background:none; border:1px solid #555; border-radius:4px;
    color:#aaa; font-size:10px; padding:2px 6px; cursor:pointer;
    line-height:1; flex-shrink:0;
}
.detail-btn:hover { border-color:#aaa; color:#fff; }

/* ── 등급 배경 카드 ── */
.rarity-card {
    border-radius:20px; padding:22px 28px;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    margin-bottom:14px;
}
/* 희귀 – 초록 */
.rarity-rare     { background:#0a2a0a; box-shadow:0 0 24px #00c853,0 0 48px #006622; }
/* 영웅 – 보라 */
.rarity-hero     { background:#1a0828; box-shadow:0 0 24px #9c27b0,0 0 48px #4a0070; }
/* 전설 – 금빛 */
.rarity-legend   { background:#2a1400; box-shadow:0 0 24px #ff8f00,0 0 48px #7a4400; }
/* 신화 – 빨강 */
.rarity-myth     { background:#2a0808; box-shadow:0 0 24px #f44336,0 0 48px #7a0000; }
/* 불멸 – 빛나는 검정 */
.rarity-immortal { background:#050505; animation:immortalGlow 2s ease-in-out infinite; }
@keyframes immortalGlow {
    0%,100% { box-shadow:0 0 10px #222,0 0 25px #111; }
    50%     { box-shadow:0 0 30px #555,0 0 60px #333; }
}
/* 비밀 – 움직이는 무지개 */
.rarity-secret {
    background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);
    background-size:400% 100%;
    animation:rainbowMove 2.5s linear infinite;
}
@keyframes rainbowMove { 0%{background-position:0%} 100%{background-position:400%} }

/* 등급 배지 */
.rarity-badge {
    font-size:12px; font-weight:bold; padding:3px 10px;
    border-radius:20px; display:inline-block; letter-spacing:1px;
}

/* ── 시작 화면 ── */
#scr-start { align-items:center; justify-content:center; gap:18px; }

/* ── 메인 화면 ── */
#action-btn {
    font-size:72px; width:200px; height:200px;
    background:#1e1e1e; border:2px solid #555;
    border-radius:16px; line-height:1;
    display:block; margin:0 auto 14px;
}

/* scrollbar */
.modal-box::-webkit-scrollbar { width:5px; }
.modal-box::-webkit-scrollbar-track { background:#1a1a1a; }
.modal-box::-webkit-scrollbar-thumb { background:#444; border-radius:4px; }
</style>
</head>
<body>
<div class="app" id="app">

<!-- 시작 화면 -->
<div class="screen" id="scr-start">
    <div style="font-size:38px;text-align:center">🍎  🍓  🍇</div>
    <h1 style="font-size:34px;color:#0f0;text-align:center">과일 농장</h1>
    <p style="color:#888;text-align:center">과일을 수확하고 팔아 부자가 되세요!</p>
    <button class="btn" id="btn-start"
        style="background:#228b22;color:#fff;font-size:20px;padding:16px 60px">시  작</button>
</div>

<!-- 닉네임 화면 -->
<div class="screen" id="scr-nick" style="align-items:center;justify-content:center;gap:14px">
    <h2 style="color:#0f0;font-size:22px">🌱 닉네임을 입력하세요</h2>
    <input id="inp-nick" type="text" maxlength="16" placeholder="닉네임 (최대 16자)"
        style="width:300px;padding:12px;font-size:16px;background:#222;color:#fff;
               border:1px solid #444;border-radius:6px;font-family:inherit">
    <p style="color:#555;font-size:12px">공백만 입력 불가</p>
    <button class="btn" id="btn-nick-ok"
        style="background:#228b22;color:#fff;font-size:16px;padding:12px 40px">확인</button>
</div>

<!-- 메인 화면 -->
<div class="screen" id="scr-main" style="justify-content:space-between">
    <!-- 상단 정보 -->
    <div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <span id="lbl-nick" style="color:#0f0;font-weight:bold;font-size:15px"></span>
            <button class="btn" id="btn-profile"
                style="background:#282828;color:#fff;font-size:15px;padding:5px 12px">👤</button>
        </div>
        <div style="display:flex;justify-content:space-between;margin-bottom:4px">
            <span id="lbl-gold" style="color:#ffd700;font-weight:bold;font-size:16px"></span>
            <span id="lbl-day"  style="color:#87ceeb;font-weight:bold;font-size:16px"></span>
        </div>
        <span id="lbl-clicks" style="color:#aaa;font-size:13px"></span>
    </div>

    <!-- 중앙: 수확 버튼 -->
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px">
        <p style="color:#444;font-size:12px">바구니를 눌러 과일을 수확하세요!</p>
        <button class="btn" id="action-btn">🧺</button>
        <span id="lbl-equipped" style="color:#888;font-size:12px;text-align:center"></span>
        <button class="btn" id="btn-equip-open"
            style="background:#323232;color:#fff;font-size:13px;padding:9px 22px">
            🔄 장착 변경</button>
    </div>

    <!-- 하단 버튼 -->
    <div style="display:flex;gap:10px">
        <button class="btn" id="btn-inv-open"
            style="flex:1;background:#8b4513;color:#fff;font-size:16px;padding:16px 0">
            🎒 인벤토리</button>
        <button class="btn" id="btn-mkt-open"
            style="flex:1;background:#dc143c;color:#fff;font-size:16px;padding:16px 0">
            🏪 시장</button>
    </div>
</div>

<!-- 획득 팝업 -->
<div id="drop-backdrop"></div>
<div id="drop-notif"></div>

<!-- 인벤토리 모달 -->
<div class="modal" id="modal-inv">
    <div class="modal-box">
        <h2 style="color:#ffd700;margin-bottom:14px">🎒 인벤토리</h2>
        <div id="inv-list"></div>
        <button class="btn" id="btn-inv-close"
            style="background:#444;color:#fff;font-size:14px;padding:10px;margin-top:14px;width:100%">닫기</button>
    </div>
</div>

<!-- 시장 모달 -->
<div class="modal" id="modal-mkt">
    <div class="modal-box">
        <h2 style="color:#ffd700;margin-bottom:6px">🏪 시장</h2>
        <div style="display:flex;justify-content:space-between;margin-bottom:10px">
            <span id="mkt-day"  style="color:#87ceeb;font-size:13px"></span>
            <span id="mkt-gold" style="color:#ffd700;font-size:13px;font-weight:bold"></span>
        </div>
        <div id="mkt-list"></div>
        <p style="color:#333;font-size:11px;text-align:center;margin-top:8px">
            시세는 매일 자정에 자동으로 변동됩니다.</p>
        <button class="btn" id="btn-mkt-close"
            style="background:#444;color:#fff;font-size:14px;padding:10px;margin-top:8px;width:100%">닫기</button>
    </div>
</div>

<!-- 자세히 보기 모달 -->
<div class="modal" id="modal-detail">
    <div class="modal-box" style="text-align:center">
        <div id="detail-content"></div>
        <button class="btn" id="btn-detail-close"
            style="background:#444;color:#fff;font-size:14px;padding:10px;width:100%">닫기</button>
    </div>
</div>

<!-- 장착 모달 -->
<div class="modal" id="modal-equip">
    <div class="modal-box">
        <h2 style="color:#ffd700;margin-bottom:14px">장착할 과일을 선택하세요</h2>
        <div id="equip-list"></div>
        <button class="btn" id="btn-equip-close"
            style="background:#444;color:#fff;font-size:14px;padding:10px;margin-top:14px;width:100%">취소</button>
    </div>
</div>

<!-- 프로필 모달 -->
<div class="modal" id="modal-profile">
    <div class="modal-box">
        <h2 style="color:#ffd700;margin-bottom:12px">👤 프로필</h2>
        <div id="profile-content"></div>
        <button class="btn" id="btn-profile-close"
            style="background:#444;color:#fff;font-size:14px;padding:10px;margin-top:14px;width:100%">닫기</button>
    </div>
</div>

<script>
// ── 과일 정의 (새 과일은 여기에만 추가) ──────────────────────
const BASE_FRUITS = [
    { name:'사과', emoji:'🍎', price:100,    rate:5.0, rarity:'희귀' },
    { name:'딸기', emoji:'🍓', price:400,    rate:1.0, rarity:'영웅' },
    { name:'포도', emoji:'🍇', price:1000,   rate:0.5, rarity:'전설' },
];
const GOLD = '황금 ';
const DIA  = '다이아몬드 ';
const WATER_PRICE = 5000;

// 등급 설정 (startPrice: 해당 등급 과일의 기본 시작 가격)
const RARITY = {
    '희귀': { label:'희귀', en:'RARE',      color:'#00c853', badgeBg:'#004d1a', cardClass:'rarity-rare',      unreleased:false, startPrice:100    },
    '영웅': { label:'영웅', en:'HERO',      color:'#ce93d8', badgeBg:'#4a0072', cardClass:'rarity-hero',      unreleased:false, startPrice:400    },
    '전설': { label:'전설', en:'LEGEND',    color:'#ffb300', badgeBg:'#5a3000', cardClass:'rarity-legend',    unreleased:false, startPrice:1000   },
    '신화': { label:'신화', en:'MYTHIC',    color:'#ef5350', badgeBg:'#5a0000', cardClass:'rarity-myth',      unreleased:true,  startPrice:4000   },
    '불멸': { label:'불멸', en:'IMMORTAL',  color:'#bbb',    badgeBg:'#111',    cardClass:'rarity-immortal',  unreleased:true,  startPrice:20000  },
    '비밀': { label:'비밀', en:'SECRET',    color:'#fff',    badgeBg:'#222',    cardClass:'rarity-secret',    unreleased:true,  startPrice:100000 },
};
// 과일 이름 → 등급 빠른 조회
function getFruitRarity(fruitName) {
    const baseName = fruitName.startsWith(GOLD) ? fruitName.slice(GOLD.length)
                   : fruitName.startsWith(DIA)  ? fruitName.slice(DIA.length)
                   : fruitName;
    const f = BASE_FRUITS.find(b => b.name === baseName);
    return f ? RARITY[f.rarity] : null;
}

// ── 카탈로그 자동 생성 ────────────────────────────────────────
function buildCatalog() {
    const emoji={}, prices={}, rates={}, inv={};
    for (const f of BASE_FRUITS) {
        // 기본
        emoji[f.name]=f.emoji; prices[f.name]=f.price; rates[f.name]=f.rate; inv[f.name]=0;
        // 황금: 드롭률 1/25, 가격 50배
        const g=GOLD+f.name;
        emoji[g]=f.emoji; prices[g]=f.price*50; rates[g]=f.rate/25; inv[g]=0;
        // 다이아몬드: 드롭률 1/100, 가격 200배
        const d=DIA+f.name;
        emoji[d]=f.emoji; prices[d]=f.price*200; rates[d]=f.rate/100; inv[d]=0;
    }
    return {emoji,prices,rates,inv};
}

// ── 게임 상태 ─────────────────────────────────────────────────
const cat = buildCatalog();
const G = {
    nickname:'', gold:0, day:1, clickCount:0,
    equippedFruit:null, activeBackground:'normal',
    waterDropPurchased:false, lastDate:new Date().toDateString(),
    emoji:{...cat.emoji}, prices:{...cat.prices},
    rates:{...cat.rates}, inventory:{...cat.inv},

    save() {
        localStorage.setItem('fruitFarm3', JSON.stringify({
            nickname:this.nickname, gold:this.gold, day:this.day,
            clickCount:this.clickCount, equippedFruit:this.equippedFruit,
            activeBackground:this.activeBackground,
            waterDropPurchased:this.waterDropPurchased, lastDate:this.lastDate,
            prices:this.prices, inventory:this.inventory,
        }));
    },
    load() {
        const d = JSON.parse(localStorage.getItem('fruitFarm3') || 'null');
        if (!d) return;
        Object.assign(this, d);
        if (d.prices) Object.assign(this.prices, d.prices);
        if (d.inventory) Object.assign(this.inventory, d.inventory);
    },
    base(fruit) {
        if (!fruit) return '';
        if (fruit.startsWith(GOLD)) return fruit.slice(GOLD.length);
        if (fruit.startsWith(DIA))  return fruit.slice(DIA.length);
        return fruit;
    },
    isGold(fruit) { return !!(fruit && fruit.startsWith(GOLD)); },
    isDia(fruit)  { return !!(fruit && fruit.startsWith(DIA)); },
    isMut(fruit)  { return this.isGold(fruit) || this.isDia(fruit); },
    get eqBase() { return this.base(this.equippedFruit); },

    registerClick() { this.clickCount += this.eqBase==='딸기' ? 2 : 1; },

    tryGetFruit() {
        const boost = this.eqBase==='딸기'||this.eqBase==='포도';
        const mult = boost ? 2 : 1;
        const roll = Math.random()*100;
        const sorted = Object.entries(this.rates).sort((a,b)=>a[1]-b[1]);
        let cum=0;
        for (const [name,rate] of sorted) {
            cum += rate*mult;
            if (roll < cum) return {fruit:name, count:this.eqBase==='포도'?2:1};
        }
        return {fruit:null, count:0};
    },

    addFruit(fruit, count=1) { this.inventory[fruit]=(this.inventory[fruit]||0)+count; },

    checkDay() {
        const today = new Date().toDateString();
        if (today===this.lastDate) return false;
        const days = Math.max(1, Math.round((new Date(today)-new Date(this.lastDate))/86400000));
        for (let i=0;i<days;i++) this.advanceDay();
        this.lastDate=today; return true;
    },
    advanceDay() {
        this.day++;
        for (const f of BASE_FRUITS) {
            const ch = Math.random()*.2-.1;
            this.prices[f.name] = Math.max(10, Math.round(this.prices[f.name]*(1+ch)));
            this.prices[GOLD+f.name] = this.prices[f.name]*50;
            this.prices[DIA+f.name]  = this.prices[f.name]*200;
        }
    },
    sellOne(f)  { if(this.inventory[f]>0){this.inventory[f]--;this.gold+=this.prices[f];} },
    sellAll(f)  { this.gold+=this.prices[f]*(this.inventory[f]||0); this.inventory[f]=0; },
    buyOne(f)   { if(this.gold<this.prices[f])return false; this.gold-=this.prices[f]; this.inventory[f]=(this.inventory[f]||0)+1; return true; },
    buyBg()     { if(this.waterDropPurchased||this.gold<WATER_PRICE)return false; this.gold-=WATER_PRICE; this.waterDropPurchased=true; return true; },
};

// ── UI 유틸 ───────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const show = id => { document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); $(id).classList.add('active'); };
const openModal  = id => $(id).classList.add('open');
const closeModal = id => $(id).classList.remove('open');

function closeDrop() {
    $('drop-notif').classList.remove('show');
    $('drop-backdrop').classList.remove('show');
}

function showDrop(fruit, count) {
    const borderColor = G.isDia(fruit) ? '#00cfff' : G.isGold(fruit) ? '#ffd700' : '#4caf50';
    const totalPrice = G.prices[fruit] * count;
    const countText = count > 1 ? ` ×${count}` : '';
    const priceText = count > 1
        ? `시세: ${G.prices[fruit].toLocaleString()}G × ${count} = ${totalPrice.toLocaleString()}G`
        : `시세: ${G.prices[fruit].toLocaleString()}G`;

    const el = $('drop-notif');
    el.style.borderColor = borderColor;
    el.innerHTML = `
        <span class="notif-emoji">${emojiHtml(fruit)}</span>
        <span class="notif-name">${fruit}${countText} 획득!</span>
        <span class="notif-price">${priceText}</span>
        <span class="notif-timer" id="notif-countdown">선택 가능까지 2초...</span>
        <div class="notif-btns" id="notif-btns">
            <button class="btn" id="btn-sell-now"
                style="background:#cc4400;color:#fff">💰 바로 팔기</button>
            <button class="btn" id="btn-to-inv"
                style="background:#228b22;color:#fff">🎒 인벤토리</button>
        </div>`;

    $('drop-backdrop').classList.add('show');
    el.classList.add('show');

    // 1초 후 카운트다운 업데이트, 2초 후 버튼 활성화
    const countdown = $('notif-countdown');
    const btns = $('notif-btns');

    setTimeout(() => { if(countdown) countdown.textContent = '선택 가능까지 1초...'; }, 1000);
    setTimeout(() => {
        if (!el.classList.contains('show')) return;
        if (countdown) countdown.style.display = 'none';
        if (btns) btns.classList.add('visible');

        $('btn-sell-now').onclick = () => {
            G.gold += totalPrice;
            G.save(); refreshMain(); closeDrop();
        };
        $('btn-to-inv').onclick = () => {
            G.addFruit(fruit, count);
            G.save(); refreshMain(); closeDrop();
        };
    }, 2000);
}

function emojiHtml(fruit) {
    const e = G.emoji[fruit] || (typeof fruit === 'string' ? fruit : '');
    if (G.isDia(fruit))  return `<span class="diamond">${e}</span>`;
    if (G.isGold(fruit)) return `<span class="golden">${e}</span>`;
    return e;
}

// 등급 색 작은 네모
function rarityDot(fruitName) {
    const r = getFruitRarity(fruitName);
    if (!r) return '';
    // 비밀 등급은 무지개 애니메이션
    const style = r.cardClass === 'rarity-secret'
        ? `class="rarity-secret" style="display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle;flex-shrink:0"`
        : `style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${r.color};box-shadow:0 0 4px ${r.color};margin-right:5px;vertical-align:middle;flex-shrink:0"`;
    return `<span ${style}></span>`;
}

function applyBg() {
    document.body.classList.toggle('waterdrop', G.activeBackground==='waterdrop');
}

// ── 메인 화면 ─────────────────────────────────────────────────
function refreshMain() {
    $('lbl-nick').textContent   = `🌱 ${G.nickname}`;
    $('lbl-gold').textContent   = `💰 골드: ${G.gold.toLocaleString()}`;
    $('lbl-day').textContent    = `📅 ${G.day}일차`;
    $('lbl-clicks').textContent = `👆 클릭: ${G.clickCount.toLocaleString()}회`;
    updateEquip();
}
// 등급별 앱 배경 (버튼색, 앱 배경)
const RARITY_APP_BG = {
    '희귀':   { appBg:'linear-gradient(135deg,#0a2a0a,#030f03)', btnBg:'#0a2a0a', border:'#00c853' },
    '영웅':   { appBg:'linear-gradient(135deg,#1a0828,#0d0414)', btnBg:'#1a0828', border:'#ce93d8' },
    '전설':   { appBg:'linear-gradient(135deg,#2a1800,#120b00)', btnBg:'#2a1800', border:'#ffb300' },
    '신화':   { appBg:'linear-gradient(135deg,#2a0808,#120404)', btnBg:'#2a0808', border:'#ef5350' },
    '불멸':   { appBg:'linear-gradient(135deg,#050505,#000)',    btnBg:'#050505', border:'#888'    },
};

function updateEquip() {
    const f=G.equippedFruit, emoji=f?G.emoji[f]:'🧺', base=G.eqBase;
    const effect = base==='딸기'?'효과: 드롭률 ×2 · 클릭수 ×2'
                 : base==='포도'?'효과: 드롭률 ×2 · 보상 ×2':'효과: 없음';

    const btn=$('action-btn');
    btn.innerHTML = f ? emojiHtml(f) : emoji;

    // 버튼 색
    const baseF = f ? BASE_FRUITS.find(b => b.name === base) : null;
    const theme = baseF ? RARITY_APP_BG[baseF.rarity] : null;
    btn.style.background  = theme ? theme.btnBg : '#1e1e1e';
    btn.style.borderColor = theme ? theme.border : '#555';

    $('lbl-equipped').textContent=`장착 중: ${emoji} ${f||'없음'}  |  ${effect}`;
}

// ── 자세히 보기 ───────────────────────────────────────────────
function renderDetail(baseName) {
    const f = BASE_FRUITS.find(b => b.name === baseName);
    if (!f) return;
    const r = RARITY[f.rarity];

    // 모달 박스 배경을 등급 색으로 변경
    const box = document.querySelector('#modal-detail .modal-box');
    box.className = 'modal-box ' + r.cardClass;
    box.style.textAlign = 'center';

    $('detail-content').innerHTML = `
        <div style="font-size:96px;line-height:1;margin-bottom:10px">${f.emoji}</div>
        <div style="font-size:26px;font-weight:bold;color:#fff;margin-bottom:10px">${f.name}</div>
        <div class="rarity-badge" style="background:${r.badgeBg};color:${r.color};
             border:2px solid ${r.color};box-shadow:0 0 12px ${r.color};
             font-size:15px;padding:5px 18px;margin-bottom:18px">
            ✦ ${r.label}
        </div>
        <div style="background:rgba(0,0,0,.45);border-radius:10px;padding:14px 18px;font-size:15px;line-height:2">
            <div>기본 시세 &nbsp;<strong style="color:#ffd700">${G.prices[f.name].toLocaleString()} G</strong></div>
            <div><span class="golden" style="font-size:15px">${f.emoji}</span> 황금 &nbsp;<strong style="color:#ffd700">${G.prices[GOLD+f.name].toLocaleString()} G</strong></div>
            <div><span class="diamond" style="font-size:15px">${f.emoji}</span> 다이아 &nbsp;<strong style="color:#00cfff">${G.prices[DIA+f.name].toLocaleString()} G</strong></div>
        </div>`;

    openModal('modal-detail');
}

// ── 확장 상태 ─────────────────────────────────────────────────
const expanded = { inv:{}, mkt:{}, equip:{} };

// ── 인벤토리 ─────────────────────────────────────────────────
function renderInv() {
    const list=$('inv-list'); list.innerHTML='';
    for (const f of BASE_FRUITS) {
        const isOpen = expanded.inv[f.name];
        // 기본 행
        const row = document.createElement('div');
        row.style.cssText='display:flex;align-items:center;gap:6px;padding:9px 10px;margin-bottom:4px;border-radius:6px;background:#1a1a1a';
        const r = getFruitRarity(f.name);
        row.innerHTML=`<span style="flex:1;color:#fff;display:flex;align-items:center">${rarityDot(f.name)}${f.emoji}  ${f.name}</span>
                       <span style="color:#90ee90;font-weight:bold;margin-right:4px">${(G.inventory[f.name]||0).toLocaleString()}개</span>
                       <button class="detail-btn" data-name="${f.name}">자세히</button>
                       <button class="toggle-btn">${isOpen?'▲':'▼'}</button>`;
        row.querySelector('.toggle-btn').onclick = () => { expanded.inv[f.name]=!isOpen; renderInv(); };
        row.querySelector('.detail-btn').onclick = (e) => { e.stopPropagation(); renderDetail(f.name); };
        list.appendChild(row);
        if (!isOpen) continue;
        // 황금 / 다이아 서브 행
        for (const [prefix, cls, color] of [[GOLD,'golden','#ffd700'],[DIA,'diamond','#00cfff']]) {
            const name = prefix+f.name;
            const sub = document.createElement('div');
            sub.className='sub-row';
            sub.style.cssText=`sub-row;display:flex;align-items:center;gap:6px;margin-left:14px;margin-bottom:4px;border-radius:6px;padding:7px 10px;background:#1a1a1a;border-left:3px solid ${color}`;
            sub.innerHTML=`<span style="flex:1;color:#fff"><span class="${cls}">${f.emoji}</span>  ${name}</span>
                           <span style="color:#90ee90;font-weight:bold">${(G.inventory[name]||0).toLocaleString()}개</span>`;
            list.appendChild(sub);
        }
    }
}

// ── 시장 ─────────────────────────────────────────────────────
function mktRow(name, color) {
    const d=document.createElement('div');
    d.style.cssText=`padding:9px 10px;margin-bottom:4px;border-radius:7px;background:#222;border-left:3px solid ${color}`;
    d.innerHTML=`
        <div style="color:#fff;font-size:12px;margin-bottom:5px">
            ${emojiHtml(name)}  ${name} &nbsp;
            시세: <span style="color:#ffd700">${G.prices[name].toLocaleString()}G</span> &nbsp;
            보유: <span style="color:#90ee90">${G.inventory[name]||0}개</span>
        </div>
        <div style="display:flex;gap:4px">
            <button class="btn ms1" data-f="${name}" style="flex:1;background:#cc4400;color:#fff;font-size:11px;padding:6px 0">1개 팔기</button>
            <button class="btn msa" data-f="${name}" style="flex:1;background:#8b0000;color:#fff;font-size:11px;padding:6px 0">전부 팔기</button>
            <button class="btn mb1" data-f="${name}" style="flex:1;background:#006b6b;color:#fff;font-size:11px;padding:6px 0">1개 구매</button>
        </div>`;
    return d;
}

function renderMkt() {
    $('mkt-day').textContent  = `📅 ${G.day}일차`;
    $('mkt-gold').textContent = `💰 골드: ${G.gold.toLocaleString()}`;
    const list=$('mkt-list'); list.innerHTML='';

    for (const f of BASE_FRUITS) {
        const isOpen = expanded.mkt[f.name];
        // 기본 행
        const row = document.createElement('div');
        row.style.cssText='padding:9px 10px;margin-bottom:4px;border-radius:7px;background:#222';
        row.innerHTML=`
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:5px">
                <span style="flex:1;color:#fff;font-size:13px;display:flex;align-items:center;flex-wrap:wrap;gap:4px">
                    ${rarityDot(f.name)}${f.emoji}  ${f.name} &nbsp;
                    시세: <span style="color:#ffd700">${G.prices[f.name].toLocaleString()}G</span> &nbsp;
                    보유: <span style="color:#90ee90">${G.inventory[f.name]||0}개</span>
                </span>
                <button class="toggle-btn">${isOpen?'▲':'▼'}</button>
            </div>
            <div style="display:flex;gap:4px">
                <button class="btn ms1" data-f="${f.name}" style="flex:1;background:#cc4400;color:#fff;font-size:11px;padding:6px 0">1개 팔기</button>
                <button class="btn msa" data-f="${f.name}" style="flex:1;background:#8b0000;color:#fff;font-size:11px;padding:6px 0">전부 팔기</button>
                <button class="btn mb1" data-f="${f.name}" style="flex:1;background:#006b6b;color:#fff;font-size:11px;padding:6px 0">1개 구매</button>
            </div>`;
        row.querySelector('.toggle-btn').onclick = () => { expanded.mkt[f.name]=!isOpen; renderMkt(); };
        list.appendChild(row);

        if (isOpen) {
            const gRow = mktRow(GOLD+f.name, '#ffd700');
            gRow.style.marginLeft='12px';
            list.appendChild(gRow);
            const dRow = mktRow(DIA+f.name, '#00cfff');
            dRow.style.marginLeft='12px';
            list.appendChild(dRow);
        }
    }
    list.querySelectorAll('.ms1').forEach(b=>b.onclick=()=>{G.sellOne(b.dataset.f);G.save();renderMkt();});
    list.querySelectorAll('.msa').forEach(b=>b.onclick=()=>{G.sellAll(b.dataset.f);G.save();renderMkt();});
    list.querySelectorAll('.mb1').forEach(b=>b.onclick=()=>{G.buyOne(b.dataset.f);G.save();renderMkt();});
}

// ── 장착 ─────────────────────────────────────────────────────
function equipOpt(fruit, borderColor='transparent', indent=false) {
    const f=fruit;
    const can = f===null || (G.inventory[f]||0)>0;
    const eq  = G.equippedFruit===f;
    const base = f ? G.base(f) : '';
    const tag  = G.isDia(f)?'(다이아)':G.isGold(f)?'(황금)':'';
    const fx = base==='딸기'?`드롭률 ×2 · 클릭수 ×2 ${tag}`
             : base==='포도'?`드롭률 ×2 · 보상 ×2 ${tag}`
             : `효과 없음 ${tag}`;
    const d=document.createElement('div');
    d.style.cssText=`padding:9px 12px;margin-bottom:4px;border-radius:8px;
        ${indent?'margin-left:14px;':''}
        cursor:${can?'pointer':'default'};opacity:${can?1:.45};
        background:${eq?'#1a4a1a':'#222'};
        border-left:3px solid ${eq?'#0f0':borderColor};`;
    d.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center">
        <span style="color:#fff;font-weight:bold;font-size:13px;display:flex;align-items:center">${f?rarityDot(f):''}${f?emojiHtml(f):'🧺'}  ${f||'없음'}</span>
        ${eq?'<span style="color:#0f0;font-size:13px">✔</span>':''}
    </div>
    <div style="color:${eq?'#90ee90':'#666'};font-size:11px;margin-top:2px">${f?fx:'효과 없음'} · 보유: ${f?(G.inventory[f]||0):'-'}개</div>`;
    if(can) d.onclick=()=>{G.equippedFruit=f;G.save();closeModal('modal-equip');updateEquip();};
    return d;
}

function renderEquip() {
    const list=$('equip-list'); list.innerHTML='';
    list.appendChild(equipOpt(null));

    for (const f of BASE_FRUITS) {
        const isOpen = expanded.equip[f.name];
        // 기본 과일 행 + 토글 버튼
        const wrap = document.createElement('div');
        wrap.style.cssText='display:flex;gap:6px;align-items:flex-start;margin-bottom:4px';
        const opt = equipOpt(f.name);
        opt.style.flex='1'; opt.style.marginBottom='0';
        const tog = document.createElement('button');
        tog.className='toggle-btn';
        tog.style.marginTop='9px';
        tog.textContent = isOpen?'▲':'▼';
        tog.onclick=()=>{ expanded.equip[f.name]=!isOpen; renderEquip(); };
        wrap.appendChild(opt); wrap.appendChild(tog);
        list.appendChild(wrap);

        if (isOpen) {
            list.appendChild(equipOpt(GOLD+f.name, '#ffd700', true));
            list.appendChild(equipOpt(DIA+f.name,  '#00cfff', true));
        }
    }
}

// ── 프로필 ────────────────────────────────────────────────────
function renderProfile() {
    const el=$('profile-content'), can=G.gold>=WATER_PRICE;
    const nActive=G.activeBackground==='normal', wActive=G.activeBackground==='waterdrop';
    el.innerHTML=`
        <p style="margin-bottom:5px">닉네임: <strong>${G.nickname}</strong></p>
        <p style="color:#ffd700;margin-bottom:14px">보유 골드: ${G.gold.toLocaleString()} G</p>
        <p style="color:#444;font-size:12px;margin-bottom:9px">─── 배경 선택 ───────────────</p>
        <div id="bg-n" style="padding:12px 16px;margin-bottom:8px;border-radius:8px;cursor:pointer;
            background:${nActive?'#1a4a1a':'#222'};border:${nActive?'2px solid #0f0':'1px solid #333'}">
            🌑  일반 배경 ${nActive?'<span style="color:#0f0">  ✔ 사용 중</span>':''}
        </div>
        <div id="bg-w" style="padding:12px 16px;border-radius:8px;
            background:${G.waterDropPurchased?(wActive?'#0a1e3c':'#222'):'#181818'};
            border:${wActive?'2px solid #4af':'1px solid #333'}">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:${G.waterDropPurchased?0:8}px">
                <span style="color:${G.waterDropPurchased?'#fff':'#555'}">
                    ${G.waterDropPurchased?'💧':'🔒'}  물방울 배경 ${wActive?'<span style="color:#4af">  ✔ 사용 중</span>':''}
                </span>
            </div>
            ${G.waterDropPurchased?'':`
                <div style="font-size:12px;color:#555;margin-bottom:7px">구매가: ${WATER_PRICE.toLocaleString()} G</div>
                <button class="btn" id="btn-buy-bg" ${can?'':'disabled'}
                    style="width:100%;background:${can?'#006b6b':'#333'};color:${can?'#fff':'#555'};font-size:13px;padding:8px 0">
                    ${can?`구매  (${WATER_PRICE.toLocaleString()} G)`:`골드 부족  (${WATER_PRICE.toLocaleString()} G 필요)`}
                </button>`}
        </div>`;
    $('bg-n').onclick=()=>{ G.activeBackground='normal'; G.save(); applyBg(); renderProfile(); };
    if (G.waterDropPurchased)
        $('bg-w').style.cursor='pointer',
        $('bg-w').onclick=()=>{ G.activeBackground='waterdrop'; G.save(); applyBg(); renderProfile(); };
    const bb=$('btn-buy-bg');
    if(bb) bb.onclick=()=>{ if(G.buyBg()){G.activeBackground='waterdrop';G.save();applyBg();renderProfile();alert('물방울 배경 구매 완료! 💧');} };
}

// ── 이벤트 ───────────────────────────────────────────────────
$('btn-start').onclick = () => G.nickname ? (show('scr-main'),refreshMain()) : show('scr-nick');

$('btn-nick-ok').onclick = () => {
    const nick=$('inp-nick').value.trim();
    if(!nick){alert('닉네임을 입력해주세요.');return;}
    G.nickname=nick; G.save(); show('scr-main'); refreshMain();
};
$('inp-nick').addEventListener('keydown',e=>{ if(e.key==='Enter')$('btn-nick-ok').click(); });

$('action-btn').onclick = () => {
    if ($('drop-notif').classList.contains('show')) return;
    G.registerClick();
    const {fruit,count}=G.tryGetFruit();
    if (fruit) { showDrop(fruit, count); }
    G.save(); refreshMain();
};

$('btn-profile').onclick      = ()=>{ renderProfile(); openModal('modal-profile'); };
$('btn-profile-close').onclick= ()=>{ closeModal('modal-profile'); refreshMain(); };

$('btn-inv-open').onclick  = ()=>{ renderInv();   openModal('modal-inv'); };
$('btn-inv-close').onclick = ()=>   closeModal('modal-inv');

$('btn-mkt-open').onclick  = ()=>{ renderMkt();   openModal('modal-mkt'); };
$('btn-mkt-close').onclick = ()=>{ closeModal('modal-mkt'); refreshMain(); };

$('btn-equip-open').onclick  = ()=>{ renderEquip();  openModal('modal-equip'); };
$('btn-equip-close').onclick  = ()=> closeModal('modal-equip');
$('btn-detail-close').onclick = ()=> closeModal('modal-detail');

// 모달 외부 클릭 닫기
document.querySelectorAll('.modal').forEach(m=>{
    m.onclick=e=>{ if(e.target===m) m.classList.remove('open'); };
});

// ── 초기화 ────────────────────────────────────────────────────
G.load();
G.checkDay();
applyBg();
G.nickname ? (show('scr-main'),refreshMain()) : show('scr-start');
setInterval(()=>{ if(G.checkDay()){G.save();refreshMain();} }, 30000);
</script>
</body>
</html>
