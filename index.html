<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🍎 과일 농장</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body {
    width:100%; height:100%;
    background:#1a1a1a; color:#fff;
    font-family:'맑은 고딕','Malgun Gothic',sans-serif;
    display:flex; justify-content:center; align-items:center;
    overflow:hidden;
}
body.juicy { background:linear-gradient(135deg,#1a0a00,#2a0a14); }

/* ══ 기본 배경 (과즙) ══════════════════════════════════════ */
body { background:#000 !important; }

/* 떠오르는 과일 */
.juice-drop {
    position:absolute; pointer-events:none; z-index:2;
    animation:juiceFloat linear infinite;
    will-change:transform,opacity;
}
@keyframes juiceFloat {
    0%   { transform:translateY(0)      rotate(0deg)   scale(1);   opacity:.32; }
    40%  { opacity:.45; }
    80%  { opacity:.2; }
    100% { transform:translateY(-110vh) rotate(30deg)  scale(.7);  opacity:0; }
}

/* 반짝임 버블 */
.juice-bubble {
    position:absolute; pointer-events:none; z-index:2;
    border-radius:50%; animation:bubbleRise linear infinite;
    will-change:transform,opacity;
}
@keyframes bubbleRise {
    0%   { transform:translateY(0) scale(1);   opacity:.5; }
    100% { transform:translateY(-110vh) scale(1.4); opacity:0; }
}

/* 앱 컨테이너 (과즙 배경 기본) */
.app {
    width: min(100vw, 100vh);
    height: min(100vw, 100vh);
    background:#000;
    position:relative;
    display:flex; flex-direction:column;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 0 40px rgba(0,0,0,.8);
}
.app::before {
    content:''; position:absolute; inset:0;
    background: linear-gradient(170deg, rgba(255,200,230,.11) 0%, rgba(255,255,255,.04) 20%, transparent 45%),
                linear-gradient(to bottom, rgba(255,255,255,.06) 0%, transparent 18%);
    pointer-events:none; z-index:1; border-radius:inherit;
}
.app::after {
    content:''; position:absolute; top:-10%; left:25%; width:50%; height:80%;
    background:linear-gradient(175deg, rgba(255,160,200,.07) 0%, transparent 70%);
    transform:rotate(-12deg) skewX(-8deg); pointer-events:none; z-index:1;
}
@keyframes juiceShift {
    0%,100% { filter:hue-rotate(0deg)   brightness(1)    saturate(1.4); }
    30%     { filter:hue-rotate(22deg)  brightness(1.18) saturate(1.65); }
    65%     { filter:hue-rotate(-18deg) brightness(1.12) saturate(1.55); }
}

.screen { display:none; padding:16px; width:100%; height:100%; flex-direction:column; overflow:hidden; position:relative; z-index:3; }
.screen.active { display:flex; }

.btn {
    border:none; border-radius:6px; cursor:pointer;
    font-family:inherit; font-weight:bold;
    transition:filter .1s;
    touch-action:manipulation; 
}
.btn:active { filter:brightness(0.85); }
.btn:disabled { opacity:.4; cursor:default; filter:none; }

/* ── 모바일: 전체화면, 스크롤 허용 ── */
@media (max-width:600px) {
    html, body { align-items:flex-start; overflow:auto; }
    .app {
        width:100vw; height:100dvh;
        border-radius:0; box-shadow:none;
    }
    .screen { padding:12px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
    #action-btn {
        width:clamp(130px,38vw,180px) !important;
        height:clamp(130px,38vw,180px) !important;
        font-size:clamp(80px,20vw,120px) !important;
    }
    .modal-box { padding:16px; max-height:92dvh; }
    .notif-emoji { font-size:clamp(48px,18vw,80px) !important; }
    .notif-name  { font-size:clamp(16px,5vw,22px) !important; }
}

.modal {
    display:none; position:fixed; top:0; left:0;
    width:100%; height:100%; background:rgba(0,0,0,.82);
    z-index:100; align-items:center; justify-content:center;
}
.modal.open { display:flex; }
.modal-box {
    background:#111; border-radius:16px; padding:22px;
    width:92%; max-width:420px;
    max-height:88vh; max-height:88dvh;
    overflow-y:auto;
}
/* 자세히 보기 전용 — 등급 클래스가 덮어씀 */
#modal-detail .modal-box  { padding:28px 22px; border-radius:0 !important; }
#modal-friends .modal-box { max-width:600px; width:96%; max-height:94dvh; padding:22px 20px; }
#modal-trade   .modal-box { max-width:560px; width:96%; max-height:92dvh; }

#drop-backdrop {
    display:none; position:fixed; inset:0;
    background:rgba(0,0,0,.6); z-index:199;
}
#drop-backdrop.show { display:block; }

#drop-notif {
    position:fixed; top:50%; left:50%;
    transform:translate(-50%, -50%) scale(0.85);
    z-index:200; pointer-events:none;
    opacity:0; transition:opacity .2s, transform .2s;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    background:#111; border-radius:0;
    padding:24px 36px; border:3px solid #555;
    min-width:240px;
}
#drop-notif.show {
    opacity:1; pointer-events:auto;
    transform:translate(-50%, -50%) scale(1);
}
#drop-notif .notif-emoji { font-size:80px; line-height:1; }
#drop-notif .notif-name  { font-size:22px; font-weight:bold; color:#fff; }
#drop-notif .notif-price { font-size:14px; color:#ffd700; }
#drop-notif .notif-btns  { display:flex; gap:10px; margin-top:4px; width:100%; opacity:0; transition:opacity .3s; }
#drop-notif .notif-btns.visible { opacity:1; }
#drop-notif .notif-btns .btn { flex:1; font-size:14px; padding:11px 0; }
#drop-notif .notif-timer { font-size:12px; color:#666; margin-top:2px; }

/* 황금 과일 이모지 효과 */
.golden {
    display:inline-block;
    filter: sepia(1) saturate(6) hue-rotate(5deg) brightness(1.25)
            drop-shadow(0 0 8px #ffd700) drop-shadow(0 0 16px #ffaa00);
    animation: goldPulse 1.8s ease-in-out infinite;
}
@keyframes goldPulse {
    0%,100% { filter: sepia(1) saturate(6) hue-rotate(5deg) brightness(1.25)
                      drop-shadow(0 0 6px #ffd700) drop-shadow(0 0 14px #ffaa00); }
    50%      { filter: sepia(1) saturate(8) hue-rotate(5deg) brightness(1.45)
                      drop-shadow(0 0 14px #ffd700) drop-shadow(0 0 28px #ffcc00); }
}
/* 다이아몬드 과일 이모지 효과 */
.diamond {
    display:inline-block;
    filter: hue-rotate(195deg) saturate(4) brightness(1.5)
            drop-shadow(0 0 8px #00cfff) drop-shadow(0 0 16px #ffffff);
    animation: diaPulse 1.5s ease-in-out infinite;
}
@keyframes diaPulse {
    0%,100% { filter: hue-rotate(195deg) saturate(4) brightness(1.5)
                      drop-shadow(0 0 6px #00cfff) drop-shadow(0 0 14px #aaffff); }
    50%      { filter: hue-rotate(210deg) saturate(6) brightness(1.9)
                      drop-shadow(0 0 18px #00cfff) drop-shadow(0 0 34px #ffffff); }
}
/* 별혼과 자세히 - 별신 오비탈 */
.deity-wrap {
    position:relative; width:200px; height:200px;
    margin:0 auto 16px; display:flex;
    align-items:center; justify-content:center;
}
.deity-glow {
    position:absolute; inset:-15px; border-radius:50%;
    background:radial-gradient(circle, rgba(100,200,255,.38) 0%, rgba(0,80,255,.18) 42%, transparent 68%);
    animation:deityPulse 2.5s ease-in-out infinite;
    pointer-events:none;
}
@keyframes deityPulse {
    0%,100%{ transform:scale(1);   opacity:.7; }
    50%    { transform:scale(1.28); opacity:1; }
}
.deity-main { position:relative; z-index:5; font-size:80px; line-height:1; }
.deity-star {
    position:absolute; top:50%; left:50%;
    width:0; height:0; pointer-events:none;
}
.deity-star span {
    position:absolute;
    font-size:15px; line-height:1;
    transform:translate(-50%,-50%);
    color:#88ddff;
    filter:drop-shadow(0 0 5px #44aaff) drop-shadow(0 0 12px #0055ff);
    animation:deityStarGlow 1.8s ease-in-out infinite alternate;
}
@keyframes deityStarGlow {
    from { opacity:.65; filter:drop-shadow(0 0 4px #44aaff) drop-shadow(0 0 8px #0044ff); }
    to   { opacity:1;   filter:drop-shadow(0 0 9px #88ddff) drop-shadow(0 0 20px #0077ff); }
}
/* 내부 궤도 r=52 */
.ds-a { animation:orbitA 4.5s linear infinite; }
.ds-b { animation:orbitA 4.5s linear infinite -1.5s; }
.ds-c { animation:orbitA 4.5s linear infinite -3s; }
@keyframes orbitA { from{transform:rotate(0deg) translateX(52px)} to{transform:rotate(360deg) translateX(52px)} }
/* 중간 궤도 r=78 (반대방향) */
.ds-d { animation:orbitB 6.5s linear infinite; }
.ds-e { animation:orbitB 6.5s linear infinite -2.17s; }
.ds-f { animation:orbitB 6.5s linear infinite -4.33s; }
@keyframes orbitB { from{transform:rotate(0deg) translateX(78px)} to{transform:rotate(-360deg) translateX(78px)} }
/* 외부 궤도 r=96 */
.ds-g { animation:orbitC 10s linear infinite; }
.ds-h { animation:orbitC 10s linear infinite -3.33s; }
.ds-i { animation:orbitC 10s linear infinite -6.67s; }
@keyframes orbitC { from{transform:rotate(0deg) translateX(96px)} to{transform:rotate(360deg) translateX(96px)} }

/* 별혼과 이모지 효과 */
.star-soul {
    display:inline-block;
    will-change:transform,filter;
    animation: starSoulFloat 4s ease-in-out infinite;
}
@keyframes starSoulFloat {
    0%,100% {
        transform: translateY(0) scale(1);
        filter: drop-shadow(0 0 6px #44aaff) drop-shadow(0 0 16px #0044ff) drop-shadow(0 0 32px #88ccff);
    }
    40% {
        transform: translateY(-7px) scale(1.09);
        filter: drop-shadow(0 0 12px #66ddff) drop-shadow(0 0 28px #0066ff) drop-shadow(0 0 56px #cceeff) hue-rotate(22deg);
    }
    70% {
        transform: translateY(-4px) scale(1.05);
        filter: drop-shadow(0 0 9px #33bbff) drop-shadow(0 0 20px #0044cc) drop-shadow(0 0 42px #aaddff) hue-rotate(-12deg);
    }
}
/* 과일 나무 배경 */
@keyframes bgStarTwinkle {
    0%,100%{ opacity:.15; transform:scale(.8); }
    50%    { opacity:1;   transform:scale(1.4); }
}
@keyframes bgFruitSway {
    from { transform:rotate(-6deg) translateY(0); }
    to   { transform:rotate(6deg)  translateY(-5px); }
}
@keyframes bgMoonGlow {
    0%,100%{ filter:drop-shadow(0 0 10px #fffaaa) drop-shadow(0 0 20px #fff8cc); }
    50%    { filter:drop-shadow(0 0 18px #fffaaa) drop-shadow(0 0 36px #fff8cc); }
}

/* 칭호 애니메이션 */
@keyframes titlePurple {
    0%,100%{ box-shadow:0 0 8px #7b1fa2,0 0 18px rgba(123,31,162,.35),inset 0 0 8px rgba(123,31,162,.15); }
    50%    { box-shadow:0 0 16px #ab47bc,0 0 34px rgba(171,71,188,.5),inset 0 0 14px rgba(171,71,188,.2); }
}
@keyframes titleSilver {
    0%,100%{ box-shadow:0 0 8px #666,0 0 18px rgba(150,150,150,.25),inset 0 0 8px rgba(150,150,150,.1); }
    50%    { box-shadow:0 0 18px #aaa,0 0 36px rgba(200,200,200,.4),inset 0 0 14px rgba(200,200,200,.15); }
}
@keyframes titleShimmer {
    0%  { background-position:200% center; }
    100%{ background-position:-200% center; }
}

/* 확장 토글 버튼 */
.toggle-btn {
    background:none; border:1px solid #444; border-radius:4px;
    color:#888; font-size:11px; padding:2px 6px; cursor:pointer;
    line-height:1; flex-shrink:0;
}
.toggle-btn:hover { border-color:#888; color:#fff; }
/* 서브 행 (황금/다이아) */
.sub-row {
    margin-left:14px; margin-bottom:4px; border-radius:6px;
    padding:7px 10px;
}

/* 자세히 보기 버튼 */
.detail-btn {
    background:none; border:1px solid #555; border-radius:4px;
    color:#aaa; font-size:10px; padding:2px 6px; cursor:pointer;
    line-height:1; flex-shrink:0;
}
.detail-btn:hover { border-color:#aaa; color:#fff; }

/* ── 등급 배경 카드 ── */
.rarity-card {
    border-radius:20px; padding:22px 28px;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    margin-bottom:14px;
}
/* 희귀 – 초록 */
.rarity-rare     { background:#0a2a0a; box-shadow:0 0 24px #00c853,0 0 48px #006622; }
/* 영웅 – 보라 */
.rarity-hero     { background:#1a0828; box-shadow:0 0 24px #9c27b0,0 0 48px #4a0070; }
/* 전설 – 금빛 */
.rarity-legend   { background:#2a1400; box-shadow:0 0 24px #ff8f00,0 0 48px #7a4400; }
/* 신화 – 빨강 */
.rarity-myth     { background:#2a0808; box-shadow:0 0 24px #f44336,0 0 48px #7a0000; }
/* 불멸 – 빛나는 검정 */
.rarity-immortal { background:#050505; animation:immortalGlow 2s ease-in-out infinite; }
@keyframes immortalGlow {
    0%,100% { box-shadow:0 0 10px #222,0 0 25px #111; }
    50%     { box-shadow:0 0 30px #555,0 0 60px #333; }
}
/* 비밀 – 별빛 우주 그라데이션 */
.rarity-secret {
    background: linear-gradient(135deg, #000820, #001848, #000c30, #001540);
    background-size: 250% 250%;
    animation: secretShift 5s ease-in-out infinite;
}
@keyframes secretShift {
    0%,100% { background-position:0% 50%;   box-shadow:0 0 22px #2266ff,0 0 48px #0033cc; }
    50%     { background-position:100% 50%; box-shadow:0 0 36px #44aaff,0 0 72px #0055ff,0 0 110px #88ccff; }
}

/* 등급 배지 */
.rarity-badge {
    font-size:12px; font-weight:bold; padding:3px 10px;
    border-radius:20px; display:inline-block; letter-spacing:1px;
}

/* ── 시작 화면 ── */
#scr-start { align-items:center; justify-content:center; gap:18px; }

/* ── 메인 화면 ── */
#action-btn {
    font-size:120px; width:200px; height:200px;
    background:none; border:none; border-radius:0;
    line-height:1; display:block; margin:0 auto 14px;
    animation: fruitFloat 3s ease-in-out infinite;
}
@keyframes fruitFloat {
    0%,100% { transform:translateY(0)   scale(1);    filter:drop-shadow(0 10px 18px rgba(0,0,0,.7)) drop-shadow(0 4px 6px rgba(0,0,0,.5)); }
    50%      { transform:translateY(-12px) scale(1.05); filter:drop-shadow(0 22px 28px rgba(0,0,0,.45)) drop-shadow(0 8px 12px rgba(0,0,0,.3)); }
}

/* scrollbar */
.modal-box::-webkit-scrollbar { width:5px; }
.modal-box::-webkit-scrollbar-track { background:#1a1a1a; }
.modal-box::-webkit-scrollbar-thumb { background:#444; border-radius:4px; }

/* 두리안 도둑 팝업 */
#durian-popup {
    position:fixed; top:50%; left:50%;
    transform:translate(-50%, -50%) scale(0.8);
    z-index:201; pointer-events:none;
    opacity:0; transition:opacity .2s, transform .2s;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    background:#1a0000; border:3px solid #ff2200;
    border-radius:20px; padding:24px 32px; min-width:240px;
    box-shadow:0 0 30px #ff0000, 0 0 60px #880000;
    text-align:center;
}
#durian-popup.show { opacity:1; transform:translate(-50%, -50%) scale(1); }
#durian-popup.flee {
    opacity:0;
    transform:translate(120%, -50%) scale(0.5) rotate(20deg);
    transition:opacity .5s, transform .5s;
}
.durian-char {
    line-height:1;
    animation:durianBounce .4s ease-in-out infinite alternate;
    display:flex; flex-direction:column; align-items:center; gap:1px;
}
@keyframes durianBounce {
    0%   { transform:translateY(0) rotate(-5deg); }
    100% { transform:translateY(-8px) rotate(5deg); }
}
.durian-stolen {
    font-size:20px; font-weight:bold; color:#ff4444;
    animation:shake .15s ease-in-out 3;
}
@keyframes shake {
    0%,100% { transform:translateX(0); }
    33%     { transform:translateX(-6px); }
    66%     { transform:translateX(6px); }
}
.durian-escape { font-size:13px; color:#888; }
</style>
</head>
<body>
<div class="app" id="app">

<!-- 시작 화면 -->
<div class="screen" id="scr-start">
    <div style="font-size:38px;text-align:center">🍎  🍓  🍇</div>
    <h1 style="font-size:34px;color:#0f0;text-align:center">과일 농장</h1>
    <p style="color:#888;text-align:center">과일을 수확하고 팔아 부자가 되세요!</p>
    <button class="btn" id="btn-start"
        style="background:#228b22;color:#fff;font-size:20px;padding:16px 60px">시  작</button>
</div>

<!-- 닉네임 화면 -->
<div class="screen" id="scr-nick" style="align-items:center;justify-content:center;gap:14px">
    <h2 style="color:#0f0;font-size:22px">🌱 닉네임을 입력하세요</h2>
    <input id="inp-nick" type="text" maxlength="16" placeholder="닉네임 (최대 16자)"
        style="width:300px;padding:12px;font-size:16px;background:#222;color:#fff;
               border:1px solid #444;border-radius:6px;font-family:inherit">
    <p style="color:#555;font-size:12px">공백만 입력 불가</p>
    <button class="btn" id="btn-nick-ok"
        style="background:#228b22;color:#fff;font-size:16px;padding:12px 40px">확인</button>
</div>

<!-- 메인 화면 -->
<div class="screen" id="scr-main" style="justify-content:space-between">
    <!-- 상단 정보 -->
    <div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px">
            <span id="lbl-nick" style="color:#0f0;font-weight:bold;font-size:15px"></span>
            <div style="display:flex;gap:6px;align-items:center">
                <button class="btn" id="btn-friends"
                    style="background:none;border:1px solid #555;border-radius:8px;color:#ccc;font-size:22px;padding:6px 14px;position:relative">
                    📦
                </button>
                <button class="btn" id="btn-profile" style="display:none">👤</button>
            </div>
        </div>
        <div id="lbl-title" style="display:none;margin-bottom:4px"></div>
        <div style="display:flex;justify-content:space-between;margin-bottom:4px">
            <span id="lbl-gold" style="color:#ffd700;font-weight:bold;font-size:16px"></span>
        </div>
        <span id="lbl-clicks" style="color:#ddd;font-size:15px;font-weight:bold;background:rgba(255,255,255,.06);border:1px solid #444;border-radius:8px;padding:3px 10px"></span>
    </div>

    <!-- 중앙: 수확 버튼 -->
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px">
        <p style="color:#aaa;font-size:12px;border:1px solid #555;border-radius:20px;padding:5px 16px;background:rgba(255,255,255,.05);letter-spacing:.5px">바구니를 눌러 과일을 수확하세요!</p>
        <button class="btn" id="action-btn">🧺</button>
        <span id="lbl-equipped" style="color:#888;font-size:12px;text-align:center"></span>
        <button class="btn" id="btn-equip-open"
            style="background:#323232;color:#fff;font-size:13px;padding:9px 22px">
            🔄 장착 변경</button>
    </div>

    <!-- 하단 버튼 -->
    <div style="display:flex;gap:8px">
        <button class="btn" id="btn-inv-open"
            style="flex:1;background:#8b4513;color:#fff;font-size:14px;padding:14px 0">
            🎒 인벤토리</button>
        <button class="btn" id="btn-mkt-open"
            style="flex:1;background:#dc143c;color:#fff;font-size:14px;padding:14px 0">
            🏪 시장</button>
        <button class="btn" id="btn-shop-open"
            style="flex:1;background:#1a5c8a;color:#fff;font-size:14px;padding:14px 0">
            🛒 상점</button>
    </div>
</div>

<!-- 획득 팝업 -->
<div id="drop-backdrop"></div>
<div id="durian-popup"></div>
<div id="drop-notif"></div>

<!-- 인벤토리 모달 -->
<div class="modal" id="modal-inv">
    <div class="modal-box">
        <h2 style="color:#ffd700;margin-bottom:14px">🎒 인벤토리</h2>
        <div id="inv-list"></div>
        <button class="btn" id="btn-inv-close"
            style="background:#444;color:#fff;font-size:14px;padding:10px;margin-top:14px;width:100%">닫기</button>
    </div>
</div>

<!-- 시장 모달 -->
<div class="modal" id="modal-mkt">
    <div class="modal-box">
        <h2 style="color:#ffd700;margin-bottom:6px">🏪 시장</h2>
        <div style="margin-bottom:10px">
            <span id="mkt-gold" style="color:#ffd700;font-size:13px;font-weight:bold"></span>
        </div>
        <div id="mkt-content"></div>
        <button class="btn" id="btn-mkt-close"

<script>
// ══════════════════════════════════════════════════════════════
// 🔥 Firebase 설정 (모든 기기 간 친구/거래 활성화)
// 1. https://console.firebase.google.com → 프로젝트 만들기
// 2. Realtime Database → 데이터베이스 만들기 → 테스트 모드
// 3. 데이터베이스 URL 복사 후 아래에 붙여넣기
const FIREBASE_URL = ''; // 예: 'https://my-app-default-rtdb.firebaseio.com'
// ══════════════════════════════════════════════════════════════

// ── 과일 정의 (새 과일은 여기에만 추가) ──────────────────────
const BASE_FRUITS = [
    { name:'사과',   emoji:'🍎', price:100, rate:5.0, rarity:'희귀' },
    { name:'복숭아', emoji:'🍑', price:150, rate:3.0, rarity:'희귀' },
    { name:'멜론',   emoji:'🍈', price:120, rate:4.0, rarity:'희귀' },
    { name:'딸기', emoji:'🍓', price:400, rate:1.0, rarity:'영웅' },
    { name:'수박', emoji:'🍉', price:500, rate:0.7, rarity:'영웅' },
    { name:'포도', emoji:'🍇', price:1000,      rate:0.5,      rarity:'전설' },
    { name:'레몬', emoji:'🍋', price:200000,    rate:0.001,    rarity:'신화' },
    { name:'할머니가 숨겨운 감', emoji:'🍊', price:1000000,  rate:0.00005,  rarity:'불멸' },
    { name:'별혼과', emoji:'🌟', price:100000000, rate:0.000001, rarity:'비밀' },
];
const GOLD = '황금 ';
const DIA  = '다이아몬드 ';
const JUICE_PRICE       = 5000;
const TITLE_GABBU_PRICE = 1000000;
const TITLE_ELON_PRICE  = 100000000;

// 등급 설정 (startPrice: 해당 등급 과일의 기본 시작 가격)
const RARITY = {
    '희귀': { label:'희귀', en:'RARE',      color:'#00c853', badgeBg:'#004d1a', cardClass:'rarity-rare',      unreleased:false, startPrice:100      },
    '영웅': { label:'영웅', en:'HERO',      color:'#ce93d8', badgeBg:'#4a0072', cardClass:'rarity-hero',      unreleased:false, startPrice:400      },
    '전설': { label:'전설', en:'LEGEND',    color:'#ffb300', badgeBg:'#5a3000', cardClass:'rarity-legend',    unreleased:false, startPrice:1000     },
    '신화': { label:'신화', en:'MYTHIC',    color:'#ef5350', badgeBg:'#5a0000', cardClass:'rarity-myth',      unreleased:false, startPrice:200000   },
    '불멸': { label:'불멸', en:'IMMORTAL',  color:'#bbb',    badgeBg:'#111',    cardClass:'rarity-immortal',  unreleased:false, startPrice:1000000  },
    '비밀': { label:'비밀', en:'SECRET',    color:'#fff',    badgeBg:'#222',    cardClass:'rarity-secret',    unreleased:false, startPrice:100000000},
};
// 과일 이름 → 등급 빠른 조회
function getFruitRarity(fruitName) {
    const baseName = fruitName.startsWith(GOLD) ? fruitName.slice(GOLD.length)
                   : fruitName.startsWith(DIA)  ? fruitName.slice(DIA.length)
                   : fruitName;
    const f = BASE_FRUITS.find(b => b.name === baseName);
    return f ? RARITY[f.rarity] : null;
}

// ── 카탈로그 자동 생성 ────────────────────────────────────────
function buildCatalog() {
    const emoji={}, prices={}, rates={}, inv={};
    for (const f of BASE_FRUITS) {
        // 기본
        emoji[f.name]=f.emoji; prices[f.name]=f.price; rates[f.name]=f.rate; inv[f.name]=0;
        // 황금: 드롭률 1/25, 가격 50배
        const g=GOLD+f.name;
        emoji[g]=f.emoji; prices[g]=f.price*50; rates[g]=f.rate/25; inv[g]=0;
        // 다이아몬드: 드롭률 1/100, 가격 125배
        const d=DIA+f.name;
        emoji[d]=f.emoji; prices[d]=f.price*125; rates[d]=f.rate/100; inv[d]=0;
    }
    return {emoji,prices,rates,inv};
}

// ── 게임 상태 ─────────────────────────────────────────────────
const cat = buildCatalog();
const G = {
    nickname:'', gold:0, day:1, clickCount:0,
    equippedFruit:null, activeBackground:'normal',
    juicePurchased:false,
    ownedTitles:[], equippedTitle:null,
    lastDate:new Date().toDateString(),
    emoji:{...cat.emoji}, prices:{...cat.prices},
    rates:{...cat.rates}, inventory:{...cat.inv},
    sellOrders:[], buyOrders:[], priceHistory:{},
    friends:[], pendingRequests:[], tradeOffers:[],

    save() {
        localStorage.setItem('fruitFarm4', JSON.stringify({
            nickname:this.nickname, gold:this.gold, day:this.day,
            clickCount:this.clickCount, equippedFruit:this.equippedFruit,
            activeBackground:this.activeBackground,
            juicePurchased:this.juicePurchased,
            ownedTitles:this.ownedTitles, equippedTitle:this.equippedTitle,
            lastDate:this.lastDate,
            prices:this.prices, inventory:this.inventory,
            sellOrders:this.sellOrders, buyOrders:this.buyOrders,
            priceHistory:this.priceHistory,
            friends:this.friends, pendingRequests:this.pendingRequests, tradeOffers:this.tradeOffers,
        }));
    },
    load() {
        const d = JSON.parse(localStorage.getItem('fruitFarm4') || 'null');
        if (!d) return;
        Object.assign(this, d);
        // 카탈로그 기본값 → 저장값 순으로 병합해 신규 과일 누락 방지
        this.prices    = Object.assign({...cat.prices},    d.prices    || {});
        this.inventory = Object.assign({...cat.inv},       d.inventory || {});
        if (d.sellOrders)   this.sellOrders   = d.sellOrders;
        if (d.buyOrders)    this.buyOrders    = d.buyOrders;
        if (d.priceHistory)    this.priceHistory    = d.priceHistory;
        if (d.friends)         this.friends         = d.friends;
        if (d.pendingRequests) this.pendingRequests = d.pendingRequests;
        if (d.tradeOffers)     this.tradeOffers     = d.tradeOffers;
    },
    processPendingOrders() {
        const now = Date.now();
        const FILL_MS = 30000;
        let changed = false;
        for (const o of this.sellOrders) {
            if (o.status==='pending' && now - o.registeredAt >= FILL_MS) {
                o.status='completed'; this.gold += o.price * o.count; changed=true;
            }
        }
        for (const o of this.buyOrders) {
            if (o.status==='pending' && now - o.registeredAt >= FILL_MS) {
                o.status='completed';
                this.inventory[o.fruit]=(this.inventory[o.fruit]||0)+o.count; changed=true;
            }
        }
        if (changed) { this.save(); refreshMain(); }
    },
    buyJuiceBg() {
        if (this.juicePurchased || this.gold < JUICE_PRICE) return false;
        this.gold -= JUICE_PRICE; this.juicePurchased = true; return true;
    },
    buyTitle(title, price) {
        if (this.ownedTitles.includes(title) || this.gold < price) return false;
        this.gold -= price; this.ownedTitles.push(title); return true;
    },
    base(fruit) {
        if (!fruit) return '';
        if (fruit.startsWith(GOLD)) return fruit.slice(GOLD.length);
        if (fruit.startsWith(DIA))  return fruit.slice(DIA.length);
        return fruit;
    },
    isGold(fruit) { return !!(fruit && fruit.startsWith(GOLD)); },
    isDia(fruit)  { return !!(fruit && fruit.startsWith(DIA)); },
    isMut(fruit)  { return this.isGold(fruit) || this.isDia(fruit); },
    get eqBase() { return this.base(this.equippedFruit); },

    registerClick() { this.clickCount += this.eqBase==='할머니가 숨겨운 감' ? 2 : 1; },

    tryGetFruit() {
        const mult = this.eqBase==='딸기'           ? 1.1
                   : this.eqBase==='할머니가 숨겨운 감' ? 2
                   : this.eqBase==='별혼과'          ? 3 : 1;
        const roll = Math.random()*100;
        const sorted = Object.entries(this.rates).sort((a,b)=>a[1]-b[1]);
        let cum=0, got=null;
        for (const [name,rate] of sorted) {
            let r = rate * mult;
            if (this.eqBase==='수박' && this.isDia(name)) r *= 1.5;
            cum += r;
            if (roll < cum) { got=name; break; }
        }
        // 포도 능력: 5% 확률로 상위 등급 과일
        if (got && this.eqBase==='포도' && Math.random()<0.05) {
            const up = upgradeRarity(got); if (up) got=up;
        }
        // 별혼과 능력: 15% 확률로 상위 등급 과일
        if (got && this.eqBase==='별혼과' && Math.random()<0.15) {
            const up = upgradeRarity(got); if (up) got=up;
        }
        // 레몬 능력: 50% 확률로 2배 지급
        const count = (got && this.eqBase==='레몬' && Math.random()<0.5) ? 2 : 1;
        return {fruit:got, count};
    },

    addFruit(fruit, count=1) { this.inventory[fruit]=(this.inventory[fruit]||0)+count; },

    checkDay() {
        const today = new Date().toDateString();
        if (today===this.lastDate) return false;
        const days = Math.max(1, Math.round((new Date(today)-new Date(this.lastDate))/86400000));
        for (let i=0;i<days;i++) this.advanceDay();
        this.lastDate=today; return true;
    },
    recordPrices() {
        for (const f of BASE_FRUITS) {
            for (const name of [f.name, GOLD+f.name, DIA+f.name]) {
                if (!this.priceHistory[name]) this.priceHistory[name] = [];
                this.priceHistory[name].push(this.prices[name]);
                if (this.priceHistory[name].length > 7) this.priceHistory[name].shift();
            }
        }
    },
    advanceDay() {
        this.day++;
        for (const f of BASE_FRUITS) {
            const sign = Math.random() < 0.5 ? 1 : -1;
            const ch = sign * (0.01 + Math.random() * 0.04);
            this.prices[f.name] = Math.max(10, Math.round(this.prices[f.name]*(1+ch)));
            this.prices[GOLD+f.name] = this.prices[f.name]*50;
            this.prices[DIA+f.name]  = this.prices[f.name]*125;
        }
        this.recordPrices();
    },
    sellOne(f)  { if(this.inventory[f]>0){this.inventory[f]--;this.gold+=this.prices[f];} },
    sellAll(f)  { this.gold+=this.prices[f]*(this.inventory[f]||0); this.inventory[f]=0; },
    buyOne(f)   { if(this.gold<this.prices[f])return false; this.gold-=this.prices[f]; this.inventory[f]=(this.inventory[f]||0)+1; return true; },
};

// 포도 능력: 상위 등급 과일로 업그레이드
function upgradeRarity(fruitName) {
    const isGold = fruitName.startsWith(GOLD);
    const isDia  = fruitName.startsWith(DIA);
    const prefix = isGold ? GOLD : isDia ? DIA : '';
    const base   = isGold ? fruitName.slice(GOLD.length) : isDia ? fruitName.slice(DIA.length) : fruitName;
    const order  = ['희귀','영웅','전설','신화','불멸','비밀'];
    const cur    = BASE_FRUITS.find(f=>f.name===base);
    if (!cur) return null;
    const idx = order.indexOf(cur.rarity);
    if (idx===-1 || idx>=order.length-1) return null;
    const next = BASE_FRUITS.find(f=>f.rarity===order[idx+1]);
    return next ? prefix+next.name : null;
}

// ── Firebase REST ──────────────────────────────────────────────
const FB = FIREBASE_URL ? {
    async get(p)      { try{const r=await fetch(`${FIREBASE_URL}/ff/${p}.json`);return await r.json();}catch{return null;} },
    async set(p,d)    { try{await fetch(`${FIREBASE_URL}/ff/${p}.json`,{method:'PUT',body:JSON.stringify(d)});}catch{} },
    async push(p,d)   { try{await fetch(`${FIREBASE_URL}/ff/${p}.json`,{method:'POST',body:JSON.stringify(d)});}catch{} },
    async del(p)      { try{await fetch(`${FIREBASE_URL}/ff/${p}.json`,{method:'DELETE'});}catch{} },
} : null;
function encN(s){ return s.replace(/[.#$[\]/]/g,'_'); }

// ── 닉네임 레지스트리 ──────────────────────────────────────────
function getNicknameRegistry() { return JSON.parse(localStorage.getItem('fruitFarm4_registry')||'{}'); }
async function isNicknameTaken(nick) {
    if (FB) { const v=await FB.get(`reg/${encN(nick)}`); return v!==null && v!==G.nickname; }
    const r=getNicknameRegistry(); return nick in r && r[nick]!==G.nickname;
}
async function registerNickname(nick) {
    if (FB) await FB.set(`reg/${encN(nick)}`, Date.now());
    const r=getNicknameRegistry(); r[nick]=Date.now(); localStorage.setItem('fruitFarm4_registry',JSON.stringify(r));
}

// ── 우편함 ─────────────────────────────────────────────────────
function getMailbox(nick)       { return JSON.parse(localStorage.getItem(`fruitFarm4_mb_${nick}`)||'[]'); }
function setMailbox(nick,msgs)  { localStorage.setItem(`fruitFarm4_mb_${nick}`,JSON.stringify(msgs)); }
function sendToMailbox(nick,msg){ const b=getMailbox(nick); b.push({...msg,ts:Date.now()}); setMailbox(nick,b); }

async function pushMsg(nick, msg) {
    if (FB) await FB.push(`mb/${encN(nick)}`, {...msg, ts:Date.now()});
    else sendToMailbox(nick, msg);
}
async function processMailbox() {
    if (!G.nickname) return;
    let msgs=[];
    if (FB) {
        const data=await FB.get(`mb/${encN(G.nickname)}`);
        if (data){ msgs=Object.values(data); await FB.del(`mb/${encN(G.nickname)}`); }
    } else {
        msgs=getMailbox(G.nickname); if(!msgs.length)return; setMailbox(G.nickname,[]);
    }
    let changed=false;
    for(const m of msgs){
        if(m.type==='friend_req')    {if(!G.pendingRequests.includes(m.from)){G.pendingRequests.push(m.from);changed=true;}}
        else if(m.type==='friend_accept'){if(!G.friends.includes(m.from)){G.friends.push(m.from);changed=true;}}
        else if(m.type==='trade')    {G.tradeOffers.push(m);changed=true;}
        else if(m.type==='trade_return'){G.gold+=m.gold||0;for(const[f,c]of Object.entries(m.items||{}))G.addFruit(f,c);changed=true;}
    }
    if(changed){G.save();updateFriendBadge();refreshMain();}
}

// ── 친구 기능 ──────────────────────────────────────────────────
async function sendFriendRequest(toNick) {
    if(!toNick) return;
    if(toNick===G.nickname)        return alert('자기 자신에게는 보낼 수 없습니다.');
    if(G.friends.includes(toNick)) return alert('이미 친구입니다.');
    if(FB){ const e=await FB.get(`reg/${encN(toNick)}`); if(!e)return alert(`'${toNick}' 닉네임이 존재하지 않습니다.`); }
    else  { const r=getNicknameRegistry(); if(!(toNick in r))return alert(`'${toNick}' 닉네임이 존재하지 않습니다.\n(Firebase 미설정: 같은 기기만 검색됩니다)`); }
    await pushMsg(toNick,{type:'friend_req',from:G.nickname});
    alert(`'${toNick}'에게 친구요청을 보냈습니다!`);
}
async function acceptFriend(fromNick) {
    if(!G.friends.includes(fromNick)) G.friends.push(fromNick);
    G.pendingRequests=G.pendingRequests.filter(n=>n!==fromNick);
    await pushMsg(fromNick,{type:'friend_accept',from:G.nickname});
    G.save(); renderFriends(); updateFriendBadge();
}
function rejectFriend(fromNick) {
    G.pendingRequests=G.pendingRequests.filter(n=>n!==fromNick);
    G.save(); renderFriends(); updateFriendBadge();
}
function removeFriend(nick) { G.friends=G.friends.filter(n=>n!==nick); G.save(); renderFriends(); }
function updateFriendBadge() {
    const total = G.pendingRequests.length + G.tradeOffers.length;
    const badge = $('friend-badge');
    if (badge) { badge.style.display = total > 0 ? 'block' : 'none'; badge.textContent = total; }
}

// ── 선물 코드 (기기 간 거래) ────────────────────────────────────
function generateGiftCode(items, gold) {
    const data = { v:1, from:G.nickname, items, gold };
    // Deduct immediately
    G.gold -= gold;
    for (const [f,c] of Object.entries(items)) G.inventory[f] = Math.max(0,(G.inventory[f]||0)-c);
    G.save(); refreshMain();
    return btoa(encodeURIComponent(JSON.stringify(data)));
}
function redeemGiftCode(code) {
    try {
        const data = JSON.parse(decodeURIComponent(atob(code.trim())));
        let msg = `🎁 ${data.from || '?'}의 선물!\n`;
        if (data.gold > 0) { G.gold += data.gold; msg += `💰 ${data.gold.toLocaleString()}G\n`; }
        for (const [f,c] of Object.entries(data.items || {})) {
            if (c > 0) { G.addFruit(f,c); msg += `${G.emoji[f]||f} ${f} ${c}개\n`; }
        }
        G.save(); refreshMain();
        alert(msg + '\n✅ 수령 완료!');
    } catch { alert('❌ 유효하지 않은 코드입니다.'); }
}

// ── 거래 ───────────────────────────────────────────────────────
async function sendTrade(toNick, items, gold) {
    if(FB){ const e=await FB.get(`reg/${encN(toNick)}`); if(!e)return alert('존재하지 않는 닉네임입니다.'); }
    else  { const r=getNicknameRegistry(); if(!(toNick in r))return alert('존재하지 않는 닉네임입니다.'); }
    G.gold-=gold;
    for(const[f,c]of Object.entries(items)) G.inventory[f]=Math.max(0,(G.inventory[f]||0)-c);
    await pushMsg(toNick,{type:'trade',from:G.nickname,items,gold});
    G.save(); refreshMain();
    alert(`'${toNick}'에게 거래 요청을 보냈습니다!`);
}
function acceptTrade(offer) {
    G.gold+=offer.gold||0;
    for(const[f,c]of Object.entries(offer.items||{}))G.addFruit(f,c);
    G.tradeOffers=G.tradeOffers.filter(o=>o.ts!==offer.ts);
    G.save(); refreshMain(); renderFriends(); updateFriendBadge();
}
async function rejectTrade(offer) {
    await pushMsg(offer.from,{type:'trade_return',from:G.nickname,items:offer.items,gold:offer.gold});
    G.tradeOffers=G.tradeOffers.filter(o=>o.ts!==offer.ts);
    G.save(); renderFriends(); updateFriendBadge();
}

// ── 선물 코드 모달 렌더 ───────────────────────────────────────
function renderFriends() {
    const el = $('friends-content');
    el.innerHTML = `
        <div style="margin-bottom:14px">
            <div style="color:#aaa;font-size:14px;margin-bottom:10px;line-height:1.6">
                과일·골드를 코드로 변환해 친구에게 전달하세요.<br>
                친구가 코드를 수령하면 즉시 지급됩니다.

function openTradeModal(toNick) {
    const el = $('trade-content');
    const state = { items:{}, gold:0 };
    const render = () => {
        const totalStr = Object.entries(state.items).filter(([,c])=>c>0).map(([f,c])=>`${G.emoji[f]||f}×${c}`).join(' ');
        let html = `<div style="color:#aaa;font-size:12px;margin-bottom:10px"><strong style="color:#0f0">${toNick}</strong>에게 보낼 항목을 선택하세요</div>`;
        // 골드
        html += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:8px 10px;background:#1a1a1a;border-radius:6px">
            <span style="color:#ffd700;flex:1">💰 골드</span>
            <input id="trade-gold" type="number" min="0" max="${G.gold}" value="${state.gold}"
                style="width:100px;padding:4px;background:#222;color:#fff;border:1px solid #444;border-radius:4px;font-size:12px">
            <span style="color:#aaa;font-size:11px">보유: ${G.gold.toLocaleString()}</span>
        </div>`;
        // 과일
        for (const f of BASE_FRUITS) {
            for (const name of [f.name, GOLD+f.name, DIA+f.name]) {
                const inv = G.inventory[name]||0;
                if (inv <= 0) continue;
                const cur = state.items[name]||0;
                html += `<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;padding:6px 10px;background:#1a1a1a;border-radius:6px">
                    <span style="flex:1;color:#fff;font-size:13px">${emojiHtml(name)} ${name}</span>
                    <button class="btn ti-m" data-n="${name}" style="background:#333;color:#fff;padding:2px 8px;font-size:14px">-</button>
                    <span style="color:#0f0;min-width:20px;text-align:center;font-size:13px">${cur}</span>
                    <button class="btn ti-p" data-n="${name}" style="background:#333;color:#fff;padding:2px 8px;font-size:14px">+</button>
                    <span style="color:#555;font-size:11px">/${inv}</span>
                </div>`;
            }
        }
        html += `<div style="margin-top:10px;padding:10px;background:#111;border-radius:6px;font-size:12px;color:#aaa;min-height:32px">
            선택: ${totalStr||'없음'} ${state.gold>0?`💰${state.gold.toLocaleString()}G`:''}
        </div>
        <button class="btn" id="btn-do-trade"
            style="width:100%;background:#cc4400;color:#fff;font-size:14px;padding:10px;margin-top:8px">거래 요청 보내기</button>`;
        el.innerHTML = html;
        el.querySelectorAll('.ti-p').forEach(b=>b.onclick=()=>{
            const n=b.dataset.n; state.items[n]=Math.min((state.items[n]||0)+1,(G.inventory[n]||0)); render();
        });
        el.querySelectorAll('.ti-m').forEach(b=>b.onclick=()=>{
            const n=b.dataset.n; state.items[n]=Math.max((state.items[n]||0)-1,0); render();
        });
        $('btn-do-trade').onclick=async()=>{
            state.gold=parseInt($('trade-gold').value)||0;
            const items=Object.fromEntries(Object.entries(state.items).filter(([,c])=>c>0));
            if (!Object.keys(items).length && state.gold<=0) return alert('보낼 항목을 선택하세요.');
            if (state.gold > G.gold) return alert('골드가 부족합니다.');
            await sendTrade(toNick, items, state.gold);
            closeModal('modal-trade');
        };
    };
    render();
    closeModal('modal-friends');
    openModal('modal-trade');
}

function showDrop(fruit, count) {
    const borderColor = G.isDia(fruit) ? '#00cfff' : G.isGold(fruit) ? '#ffd700' : '#4caf50';
    const totalPrice = G.prices[fruit] * count;
    const countText = count > 1 ? ` ×${count}` : '';
    const priceText = count > 1
        ? `시세: ${G.prices[fruit].toLocaleString()}G × ${count} = ${totalPrice.toLocaleString()}G`
        : `시세: ${G.prices[fruit].toLocaleString()}G`;

    const el = $('drop-notif');
    el.style.borderColor = borderColor;
    el.innerHTML = `
        <span class="notif-emoji">${emojiHtml(fruit)}</span>
        <span class="notif-name">${fruit}${countText} 획득!</span>
        <span class="notif-price">${priceText}</span>
        <span class="notif-timer" id="notif-countdown">선택 가능까지 2초...</span>
        <div class="notif-btns" id="notif-btns">
            <button class="btn" id="btn-sell-now"
                style="background:#cc4400;color:#fff">💰 바로 팔기</button>
            <button class="btn" id="btn-to-inv"
                style="background:#228b22;color:#fff">🎒 인벤토리</button>
        </div>`;

    $('drop-backdrop').classList.add('show');
    el.classList.add('show');

    // 1초 후 카운트다운 업데이트, 2초 후 버튼 활성화
    const countdown = $('notif-countdown');
    const btns = $('notif-btns');

    setTimeout(() => { if(countdown) countdown.textContent = '선택 가능까지 1초...'; }, 1000);
    setTimeout(() => {
        if (!el.classList.contains('show')) return;
        if (countdown) countdown.style.display = 'none';
        if (btns) btns.classList.add('visible');

        $('btn-sell-now').onclick = () => {
            G.gold += totalPrice;
            G.save(); refreshMain(); closeDrop();
        };
        $('btn-to-inv').onclick = () => {
            G.addFruit(fruit, count);
            G.save(); refreshMain(); closeDrop();
        };
    }, 2000);
}

function emojiHtml(fruit) {
    const e = G.emoji[fruit] || (typeof fruit === 'string' ? fruit : '');
    if (G.isDia(fruit))  return `<span class="diamond">${e}</span>`;
    if (G.isGold(fruit)) return `<span class="golden">${e}</span>`;
    const bf = BASE_FRUITS.find(f => f.name === G.base(fruit));
    if (bf && bf.rarity === '비밀') return `<span class="star-soul">${e}</span>`;
    return e;
}

function updateEquip() {
    const f=G.equippedFruit, emoji=f?G.emoji[f]:'🧺', base=G.eqBase;
    const effect = base==='딸기'?'효과: 드롭 확률 ×1.1'
                 : base==='수박'?'효과: 다이아 열매 확률 ×1.5'
                 : base==='포도'?'효과: 5% 확률 상위 등급 등장'
                 : base==='레몬'?'효과: 50% 확률 과일 2배 지급'
                 : base==='할머니가 숨겨운 감'?'효과: 클릭수 ×2 · 드롭 확률 ×2'
                 : base==='별혼과'?'효과: 드롭 확률 ×3 · 15% 상위 등급 등장':'효과: 없음';

    const btn=$('action-btn');
    btn.innerHTML = f ? emojiHtml(f) : emoji;

    // 버튼 색
    const baseF = f ? BASE_FRUITS.find(b => b.name === base) : null;
    const theme = baseF ? RARITY_APP_BG[baseF.rarity] : null;

// ── 가격 꺾은선 그래프 ─────────────────────────────────────────
function drawPriceChart(canvas, history, lineColor) {
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.clientWidth || 280;
    const H = canvas.clientHeight || 90;
    canvas.width  = W * dpr;
    canvas.height = H * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, W, H);

    if (!history || history.length < 2) {
        ctx.fillStyle = '#555';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('데이터 수집 중...', W/2, H/2 + 4);
        return;
    }

    const pad = {top:8, right:10, bottom:18, left:46};
    const cW = W - pad.left - pad.right;
    const cH = H - pad.top - pad.bottom;

    const minV = Math.min(...history);
    const maxV = Math.max(...history);
    const range = maxV - minV || maxV * 0.1 || 1;

    const px = i => pad.left + (i / (history.length - 1)) * cW;
    const py = v => pad.top + cH - ((v - minV) / range) * cH;

    // 격자
    ctx.strokeStyle = '#2a2a2a';
    ctx.lineWidth = 1;
    [0, 0.5, 1].forEach(t => {
        const yp = pad.top + cH * t;
        ctx.beginPath(); ctx.moveTo(pad.left, yp); ctx.lineTo(pad.left + cW, yp); ctx.stroke();
    });

    // Y 레이블
    const fmt = v => v >= 1000000 ? (v/1000000).toFixed(1)+'M' : v >= 1000 ? (v/1000).toFixed(1)+'K' : String(v);
    ctx.fillStyle = '#666'; ctx.font = '9px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(fmt(maxV), pad.left - 3, pad.top + 4);
    ctx.fillText(fmt(minV), pad.left - 3, pad.top + cH + 3);

    // X 레이블
    ctx.textAlign = 'center';
    history.forEach((_, i) => {
        const label = i === history.length - 1 ? '오늘' : `-${history.length - 1 - i}일`;
        ctx.fillText(label, px(i), H - 2);
    });

    // 면적 채우기
    const grad = ctx.createLinearGradient(0, pad.top, 0, pad.top + cH);
    grad.addColorStop(0, lineColor + '55');
    grad.addColorStop(1, lineColor + '05');
    ctx.fillStyle = grad;
    ctx.beginPath();
    history.forEach((v, i) => i === 0 ? ctx.moveTo(px(i), py(v)) : ctx.lineTo(px(i), py(v)));
    ctx.lineTo(px(history.length - 1), pad.top + cH);
    ctx.lineTo(px(0), pad.top + cH);
    ctx.closePath();
    ctx.fill();

    // 꺾은선
    ctx.strokeStyle = lineColor; ctx.lineWidth = 2; ctx.lineJoin = 'round';
    ctx.beginPath();
    history.forEach((v, i) => i === 0 ? ctx.moveTo(px(i), py(v)) : ctx.lineTo(px(i), py(v)));
    ctx.stroke();

    // 점
    history.forEach((v, i) => {
        const isLast = i === history.length - 1;
        ctx.beginPath();
        ctx.arc(px(i), py(v), isLast ? 4 : 2.5, 0, Math.PI * 2);
        ctx.fillStyle = isLast ? '#fff' : lineColor;
        ctx.fill();
        if (isLast) {
            ctx.strokeStyle = lineColor; ctx.lineWidth = 2; ctx.stroke();
        }
    });
}

function equipOpt(fruit, borderColor='transparent', indent=false) {
    const f=fruit;
    const can = f===null || (G.inventory[f]||0)>0;
    const eq  = G.equippedFruit===f;
    const base = f ? G.base(f) : '';
    const tag  = G.isDia(f)?'(다이아)':G.isGold(f)?'(황금)':'';
    const fx = base==='딸기'?`드롭 확률 ×1.1 ${tag}`
             : base==='수박'?`다이아 열매 확률 ×1.5 ${tag}`
             : base==='포도'?`5% 확률 상위 등급 등장 ${tag}`
             : base==='레몬'?`50% 확률 과일 2배 지급 ${tag}`
             : base==='할머니가 숨겨운 감'?`클릭수 ×2 · 드롭 확률 ×2 ${tag}`
             : base==='별혼과'?`드롭 확률 ×3 · 15% 상위 등급 등장 ${tag}`
             : `효과 없음 ${tag}`;
    const d=document.createElement('div');
    d.style.cssText=`padding:9px 12px;margin-bottom:4px;border-radius:8px;
        ${indent?'margin-left:14px;':''}
        cursor:${can?'pointer':'default'};opacity:${can?1:.45};
        background:${eq?'#1a4a1a':'#222'};
        border-left:3px solid ${eq?'#0f0':borderColor};`;
    d.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center">
        <span style="color:#fff;font-weight:bold;font-size:13px;display:flex;align-items:center">${f?rarityDot(f):''}${f?emojiHtml(f):'🧺'}  ${f||'없음'}</span>
        ${eq?'<span style="color:#0f0;font-size:13px">✔</span>':''}
    </div>
    <div style="color:${eq?'#90ee90':'#666'};font-size:11px;margin-top:2px">${f?fx:'효과 없음'} · 보유: ${f?(G.inventory[f]||0):'-'}개</div>`;
    if(can) d.onclick=()=>{G.equippedFruit=f;G.save();closeModal('modal-equip');updateEquip();};
    return d;
}

            <div style="display:flex;gap:8px">
                ${!it.owned
                    ? `<button class="btn" id="shop-buy-${it.id}" ${canBuy?'':'disabled'}
                           style="flex:1;background:${canBuy?'#1a5c8a':'#333'};color:${canBuy?'#fff':'#555'};font-size:13px;padding:9px 0">
                           ${canBuy?`구매 (${it.price.toLocaleString()}G)`:`골드 부족`}</button>`
                    : it.active
                        ? `<button class="btn" id="shop-off-${it.id}"
                               style="flex:1;background:#333;color:#aaa;font-size:13px;padding:9px 0">해제</button>`
                        : `<button class="btn" id="shop-use-${it.id}"
                               style="flex:1;background:#2a6a2a;color:#fff;font-size:13px;padding:9px 0">장착</button>`
                }
            </div>`;
        list.appendChild(div);

        const buyBtn = document.getElementById(`shop-buy-${it.id}`);
        const useBtn = document.getElementById(`shop-use-${it.id}`);
        const offBtn = document.getElementById(`shop-off-${it.id}`);
        if (buyBtn) buyBtn.onclick = it.onBuy;
        if (useBtn) useBtn.onclick = it.onUse;
        if (offBtn) offBtn.onclick = it.onOff;
    }
}

// ── 이벤트 ───────────────────────────────────────────────────
$('btn-start').onclick = () => G.nickname ? (show('scr-main'),refreshMain()) : show('scr-nick');

$('btn-nick-ok').onclick = async () => {
    const nick=$('inp-nick').value.trim();
    if(!nick){alert('닉네임을 입력해주세요.');return;}
    if(await isNicknameTaken(nick)){alert(`❌ '${nick}'은(는) 이미 사용 중인 닉네임입니다.\n다른 닉네임을 선택해주세요.`);return;}
    await registerNickname(nick);
    G.nickname=nick; G.save(); show('scr-main'); refreshMain();
};
$('inp-nick').addEventListener('keydown',e=>{ if(e.key==='Enter')$('btn-nick-ok').click(); });

$('action-btn').onclick = () => {
    if ($('drop-notif').classList.contains('show')) return;
    G.registerClick();

    // 두리안 도둑 0.5% 체크
    if (checkDurian()) return;

    const {fruit,count}=G.tryGetFruit();
    if (fruit) { showDrop(fruit, count); }
    G.save(); refreshMain();
};

// 프로필 버튼 비활성화
$('btn-profile-close').onclick = ()=>{ closeModal('modal-profile'); refreshMain(); };
$('btn-friends').onclick      = ()=>{ renderFriends(); openModal('modal-friends'); };
$('btn-friends-close').onclick= ()=>{ closeModal('modal-friends'); };
$('btn-trade-close').onclick  = ()=>{ closeModal('modal-trade'); };

$('btn-inv-open').onclick  = ()=>{ expanded.inv={}; renderInv(); openModal('modal-inv'); };
$('btn-inv-close').onclick = ()=>   closeModal('modal-inv');

$('btn-mkt-open').onclick  = ()=>{ expanded.mkt={}; renderMkt(); openModal('modal-mkt'); };
$('btn-mkt-close').onclick = ()=>{ closeModal('modal-mkt'); refreshMain(); };

$('btn-equip-open').onclick  = ()=>{ expanded.equip={}; renderEquip(); openModal('modal-equip'); };
$('btn-equip-close').onclick  = ()=> closeModal('modal-equip');
$('btn-detail-close').onclick = ()=> closeModal('modal-detail');
$('btn-shop-open').onclick    = ()=>{ renderShop(); openModal('modal-shop'); };
$('btn-shop-close').onclick   = ()=>{ closeModal('modal-shop'); refreshMain(); };

// 모달 외부 클릭 닫기
document.querySelectorAll('.modal').forEach(m=>{
    m.onclick=e=>{ if(e.target===m) m.classList.remove('open'); };
});

// ── 초기화 ────────────────────────────────────────────────────
function startGame() {
    G.load();
    G.checkDay();
    if (!Object.keys(G.priceHistory).length) G.recordPrices();
    applyBg();
    if (G.nickname) {
        registerNickname(G.nickname);
        processMailbox();
        show('scr-main'); refreshMain(); updateFriendBadge();
    } else {
        show('scr-start');
    }
    setInterval(()=>{ if(G.checkDay()){G.save();refreshMain();} }, 30000);
    setInterval(()=>{ processMailbox(); updateFriendBadge(); }, 5000);
}

startGame();
</script>
